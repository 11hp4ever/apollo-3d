<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Мир Риты</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #170000;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
    <audio id="music" src="./music.mp3" loop></audio>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
    const music = document.getElementById("music");

music.volume = 0.5;

// пытаемся включить сразу
music.play().catch(() => {});

// если Chrome не разрешил автозапуск,
// музыка включится после первого клика
function startMusic() {
  music.play();
  document.removeEventListener("click", startMusic);
}

document.addEventListener("click", startMusic);
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x170000);
scene.fog = new THREE.Fog(0x170000, 25, 140);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

document.body.appendChild(
  renderer.domElement
);

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;


// СВЕТ

scene.add(
  new THREE.AmbientLight(
    0xffffff,
    1.5
  )
);

const mainLight =
new THREE.DirectionalLight(
  0xffffff,
  2.8
);

mainLight.position.set(
  8,
  12,
  10
);

scene.add(mainLight);

const redLight =
new THREE.PointLight(
  0xff2a2a,
  35,
  140
);

redLight.position.set(
  -10,
  8,
  -10
);

scene.add(redLight);

const pinkLight =
new THREE.PointLight(
  0xff5c8a,
  20,
  100
);

pinkLight.position.set(
  10,
  4,
  8
);

scene.add(pinkLight);


// ЗВЁЗДЫ

function createStars() {

  const geometry =
  new THREE.BufferGeometry();

  const positions = [];

  for (let i = 0; i < 4200; i++) {

    positions.push(
      (Math.random() - 0.5) * 280,
      (Math.random() - 0.5) * 280,
      (Math.random() - 0.5) * 280
    );

  }

  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
      positions,
      3
    )
  );

  const material =
  new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.28,
    transparent: true,
    opacity: 0.95
  });

  const stars =
  new THREE.Points(
    geometry,
    material
  );

  scene.add(stars);

  return stars;
}

const stars = createStars();


// СНЕЖИНКИ

function createSnow() {

  const geometry =
  new THREE.BufferGeometry();

  const positions = [];

  for (let i = 0; i < 2800; i++) {

    positions.push(
      (Math.random() - 0.5) * 190,
      (Math.random() - 0.5) * 190,
      (Math.random() - 0.5) * 190
    );

  }

  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
      positions,
      3
    )
  );

  const material =
  new THREE.PointsMaterial({
    color: 0xffeeee,
    size: 0.45,
    transparent: true,
    opacity: 0.8
  });

  const snow =
  new THREE.Points(
    geometry,
    material
  );

  scene.add(snow);

  return snow;
}

const snow = createSnow();


// ПЛАНЕТА

const planetRadius = 4.8;

const planet =
new THREE.Mesh(

  new THREE.SphereGeometry(
    planetRadius,
    80,
    80
  ),

  new THREE.MeshStandardMaterial({
    color: 0xa30f0f,
    roughness: 0.95,
    metalness: 0.1,
    emissive: 0x2a0000,
    emissiveIntensity: 0.45
  })

);

planet.position.set(
  0,
  -6.5,
  0
);

scene.add(planet);


// КОЛЬЦА

const ring1 =
new THREE.Mesh(

  new THREE.TorusGeometry(
    6.5,
    0.12,
    24,
    160
  ),

  new THREE.MeshStandardMaterial({
    color: 0xff7b7b,
    emissive: 0x5c1111,
    emissiveIntensity: 0.5
  })

);

ring1.position.copy(
  planet.position
);

ring1.rotation.x =
Math.PI / 2.7;

scene.add(ring1);


const ring2 =
new THREE.Mesh(

  new THREE.TorusGeometry(
    7.3,
    0.06,
    24,
    160
  ),

  new THREE.MeshStandardMaterial({
    color: 0xffb3b3,
    emissive: 0x551111,
    emissiveIntensity: 0.4
  })

);

ring2.position.copy(
  planet.position
);

ring2.rotation.x =
Math.PI / 2.55;

scene.add(ring2);


// ФИГУРЫ

const floatingShapes = [];

function material(color) {

  return new THREE.MeshStandardMaterial({
    color,
    emissive: color,
    emissiveIntensity: 0.2,
    roughness: 0.3,
    metalness: 0.5
  });

}

function addShape(
  geometry,
  color,
  radius,
  speed,
  y
) {

  const mesh =
  new THREE.Mesh(
    geometry,
    material(color)
  );

  scene.add(mesh);

  floatingShapes.push({
    mesh,
    radius,
    speed,
    y,
    offset:
    Math.random() *
    Math.PI *
    2
  });

}


// КУБ

addShape(
  new THREE.BoxGeometry(
    1.5,
    1.5,
    1.5
  ),
  0xff4040,
  12,
  0.5,
  4
);


// СФЕРА

addShape(
  new THREE.SphereGeometry(
    1,
    50,
    50
  ),
  0xffaaaa,
  10,
  0.7,
  6
);


// TORUS KNOT

addShape(
  new THREE.TorusKnotGeometry(
    0.9,
    0.28,
    180,
    24
  ),
  0xff6666,
  13,
  0.6,
  7
);


// 100 УГОЛЬНИК

addShape(
  new THREE.CylinderGeometry(
    1.3,
    1.3,
    0.35,
    100
  ),
  0xffcccc,
  14,
  0.45,
  8
);


// ИКОСАЭДР

addShape(
  new THREE.IcosahedronGeometry(
    1.1
  ),
  0xff8888,
  11,
  0.8,
  5
);


// ДОДЕКАЭДР

addShape(
  new THREE.DodecahedronGeometry(
    1
  ),
  0xff5555,
  15,
  0.4,
  9
);


// ТОР

addShape(
  new THREE.TorusGeometry(
    1.2,
    0.35,
    30,
    100
  ),
  0xff9999,
  9,
  0.9,
  7
);


// ТЕКСТ РИТА

const texts = [];

function createText(
  text,
  radius,
  speed,
  height
) {

  const canvas =
  document.createElement(
    "canvas"
  );

  canvas.width = 512;
  canvas.height = 160;

  const ctx =
  canvas.getContext("2d");

  ctx.font =
  "bold 64px Arial";

  ctx.textAlign =
  "center";

  ctx.textBaseline =
  "middle";

  ctx.fillStyle =
  "#ffd6e7";

  ctx.shadowColor =
  "#ff5577";

  ctx.shadowBlur = 20;

  ctx.fillText(
    text,
    256,
    80
  );

  const texture =
  new THREE.CanvasTexture(
    canvas
  );

  const sprite =
  new THREE.Sprite(

    new THREE.SpriteMaterial({
      map: texture,
      transparent: true,
      opacity: 0.12,
      depthWrite: false
    })

  );

  sprite.scale.set(
    6,
    1.8,
    1
  );

  scene.add(sprite);

  texts.push({
    sprite,
    radius,
    speed,
    height,
    offset:
    Math.random() *
    Math.PI *
    2
  });

}

createText(
  "РИТА",
  18,
  0.12,
  7
);

createText(
  "МИР РИТЫ",
  22,
  0.09,
  10
);

createText(
  "РИТА",
  27,
  0.06,
  5
);

createText(
  "МИР РИТЫ",
  30,
  0.05,
  13
);


// ЗАГРУЗЧИК

const draco =
new DRACOLoader();

draco.setDecoderPath(
  "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
);

const loader =
new GLTFLoader();

loader.setDRACOLoader(
  draco
);

loader.setMeshoptDecoder(
  MeshoptDecoder
);


// ДЖЕЙК

let model;

let leftArm;
let rightArm;

let leftArmStart = 0;
let rightArmStart = 0;

let time = 0;

let baseY = 0;


function findBone(
  model,
  names
) {

  let found = null;

  model.traverse(
    object => {

      if (
        object.isBone &&
        !found
      ) {

        const name =
        object.name
        .toLowerCase();

        for (
          const search
          of names
        ) {

          if (
            name.includes(
              search
            )
          ) {

            found =
            object;

            break;

          }

        }

      }

    }
  );

  return found;
}


loader.load(

  "./jake_oufits_2.glb",

  function(gltf) {

    model =
    gltf.scene;

    model.scale.set(
      1.9,
      1.9,
      1.9
    );

    scene.add(model);


    const box =
    new THREE.Box3()
    .setFromObject(
      model
    );

    const center =
    box.getCenter(
      new THREE.Vector3()
    );

    const size =
    box.getSize(
      new THREE.Vector3()
    );


    model.position.sub(
      center
    );


    baseY =
    planet.position.y +
    planetRadius +
    size.y * 0.48;


    model.position.set(
      0,
      baseY,
      0
    );


    camera.position.set(
      0,
      baseY + 5,
      22
    );


    controls.target.set(
      0,
      baseY + 2,
      0
    );


    controls.update();


    leftArm =
    findBone(
      model,
      [
        "leftarm",
        "left_arm",
        "upperarm_l",
        "mixamorigleftarm"
      ]
    );


    rightArm =
    findBone(
      model,
      [
        "rightarm",
        "right_arm",
        "upperarm_r",
        "mixamorigrightarm"
      ]
    );


    if (leftArm) {

      leftArmStart =
      leftArm.rotation.z;

    }


    if (rightArm) {

      rightArmStart =
      rightArm.rotation.z;

    }

  },

  undefined,

  function(error) {

    console.error(
      error
    );

  }

);


// АНИМАЦИЯ

function animate() {

  requestAnimationFrame(
    animate
  );


  const t =
  performance.now() *
  0.001;


  if (model) {

    time += 0.05;


    model.position.y =
    baseY +
    Math.abs(
      Math.sin(
        time * 2
      )
    ) *
    0.35;


    model.position.x =
    Math.sin(time) *
    0.3;


    model.rotation.y =
    Math.sin(
      time * 0.9
    ) *
    0.4;


    model.rotation.z =
    Math.sin(
      time * 2
    ) *
    0.1;


    // РУКИ

    if (leftArm) {

      leftArm.rotation.z =
      leftArmStart +
      Math.sin(
        t * 3
      ) *
      0.6;

      leftArm.rotation.x =
      Math.sin(
        t * 2
      ) *
      0.25;

    }


    if (rightArm) {

      rightArm.rotation.z =
      rightArmStart -
      Math.sin(
        t * 3
      ) *
      0.6;

      rightArm.rotation.x =
      -Math.sin(
        t * 2
      ) *
      0.25;

    }

  }


  planet.rotation.y +=
  0.002;


  ring1.rotation.z +=
  0.003;


  ring2.rotation.z -=
  0.002;


  stars.rotation.y +=
  0.0001;


  snow.rotation.y +=
  0.0006;


  floatingShapes.forEach(
    (item, index) => {

      const tt =
      t *
      item.speed +
      item.offset;


      item.mesh.position.x =
      Math.cos(tt) *
      item.radius;


      item.mesh.position.z =
      Math.sin(tt) *
      item.radius;


      item.mesh.position.y =
      item.y +
      Math.sin(
        tt * 2
      ) *
      2;


      item.mesh.rotation.x +=
      0.01;


      item.mesh.rotation.y +=
      0.015;


      item.mesh.rotation.z +=
      0.006;

    }
  );


  texts.forEach(
    (item, index) => {

      const tt =
      t *
      item.speed +
      item.offset;


      item.sprite.position.x =
      Math.cos(tt) *
      item.radius;


      item.sprite.position.z =
      Math.sin(tt) *
      item.radius;


      item.sprite.position.y =
      item.height +
      Math.sin(
        tt * 1.5
      ) *
      2;


      item.sprite.material.opacity =
      0.06 +
      (
        Math.sin(
          tt * 2
        ) +
        1
      ) *
      0.045;

    }
  );


  controls.update();


  renderer.render(
    scene,
    camera
  );

}


animate();


// РАЗМЕР ЭКРАНА

window.addEventListener(
  "resize",
  function() {

    camera.aspect =
    window.innerWidth /
    window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
